<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — VitaTrack</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1A569B" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff; text-align: center;
      background: linear-gradient(135deg, #172554 0%, #1e3a8a 50%, #1e40af 100%);
      padding: 24px;
    }
    .card { max-width: 360px; }
    img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 900; margin: 0 0 8px; }
    p { color: rgba(191, 219, 254, 0.9); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
    button {
      background: #fff; color: #1e3a5f; font-weight: 800; font-size: 15px;
      border: none; border-radius: 14px; padding: 14px 32px; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .hint { margin-top: 24px; font-size: 12px; color: rgba(191, 219, 254, 0.7); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/icon.png" alt="VitaTrack" />
    <h1>You're offline</h1>
    <p>
      This page hasn't been saved for offline use yet. Pages you've already visited are still
      available, and anything you save while offline will sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">🇿🇦 VitaTrack · your data is stored in South Africa</div>
  </div>
  <script>
    // Auto-reload when connectivity returns.
    window.addEventListener('online', () => location.reload())
  </script>
</body>
</html>

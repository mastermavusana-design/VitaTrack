name: medication-reminders

# Replaces the Vercel Cron (removed from apps/web/vercel.json because the Hobby
# plan caps crons at once/day). Hits the existing /api/cron/reminders endpoint
# every 5 minutes with the same Bearer CRON_SECRET the endpoint already checks.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CRON_SECRET        - same value as the CRON_SECRET env var in Vercel (Production)
#   REMINDERS_CRON_URL - https://vita-track-life.vercel.app/api/cron/reminders
#
# NOTE: GitHub's scheduled runner can be delayed several minutes under load, and
# the endpoint uses a tight 5-minute window (WINDOW_MIN), so a late run may skip
# that window's reminders. If on-time delivery is critical, use a dedicated
# scheduler (cron-job.org / Upstash QStash) pointed at the same URL + header.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: medication-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders sender
        run: |
          curl -fsS --max-time 60 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${REMINDERS_CRON_URL}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDERS_CRON_URL: ${{ secrets.REMINDERS_CRON_URL }}

# Supabase project config — VitaTrack
# https://supabase.com/docs/guides/cli/config

[project]
id = "vitatrack"

[api]
# Port for the local API server
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://localhost"

[local_smtp]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "https://app.vitatrack.co.za",
  "https://app.vitatrack.co.za/auth/callback",
  "vitatrack://",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

# ─── Edge Function cron schedules ─────────────────────────────────────────────

[functions.dose-materialize]
# Every 15 min: create pending doses from schedules, reconcile against actual
# logging, and expire truly-missed ones. Must run before caregiver-alert can
# detect anything.
verify_jwt = false
schedule = "*/15 * * * *"

[functions.caregiver-alert]
# Fire every 10 minutes to detect missed doses
verify_jwt = false
schedule = "*/10 * * * *"

[functions.refill-daily]
# Fire daily at 09:00 SAST (07:00 UTC)
verify_jwt = false
schedule = "0 7 * * *"

[functions.send-reminders]
# R1 Phase D / R4: in-region (af-south-1) Web Push reminder sender — replaces the
# Vercel cron /api/cron/reminders. Every 5 minutes (must match WINDOW_MIN in the
# function). Requires VAPID_* secrets. Remove the Vercel `crons` entry only AFTER
# this is deployed + verified (see R1_BUILD_PLAN.md Phase D).
verify_jwt = false
schedule = "*/5 * * * *"

[functions.data-export]
verify_jwt = false

[functions.send-family-invite]
verify_jwt = false

# ─── Analytics ────────────────────────────────────────────────────────────────
[analytics]
enabled = false
